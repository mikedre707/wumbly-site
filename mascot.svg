<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Wumbly: round indigo blob with an antenna, ear nub, and a big friendly face -->
  <g>
    <!-- antenna -->
    <path d="M60 18 C 62 10, 70 8, 74 10" stroke="#4863c4" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="76" cy="9" r="6" fill="#5b7be8" stroke="#4863c4" stroke-width="2"/>
    <!-- ear nub -->
    <ellipse cx="103" cy="52" rx="12" ry="9" fill="#5b7be8" stroke="#4863c4" stroke-width="3"/>
    <!-- head -->
    <circle cx="60" cy="64" r="46" fill="#5b7be8" stroke="#4863c4" stroke-width="3"/>
    <!-- face patch -->
    <ellipse cx="60" cy="76" rx="26" ry="22" fill="#f3f6ff"/>
    <!-- eyes -->
    <circle cx="46" cy="58" r="5.5" fill="#292e54"/>
    <circle cx="74" cy="58" r="5.5" fill="#292e54"/>
    <circle cx="48" cy="56" r="1.8" fill="#ffffff"/>
    <circle cx="76" cy="56" r="1.8" fill="#ffffff"/>
    <!-- blush -->
    <circle cx="34" cy="70" r="6" fill="#f5a9c4" opacity="0.85"/>
    <circle cx="86" cy="70" r="6" fill="#f5a9c4" opacity="0.85"/>
    <!-- smile -->
    <path d="M50 76 Q 60 86 70 76" stroke="#292e54" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
